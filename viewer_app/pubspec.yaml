name: viewer_app
description: "App de CCTV CANAL 7 (celular y Android TV): señal en vivo y noticias del canal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  wakelock_plus: ^1.8.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Ícono de la app (celular y TV comparten los mipmaps de src/main). Fuente:
# branding_src/ (fuera de assets/ a propósito: no se empaqueta en la app).
# Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "branding_src/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding_src/app_icon_foreground.png"
  # El margen ya viene en la imagen (logo al 64% del lienzo): sin esto el
  # paquete agrega otro 16% y el logo queda chiquito.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Splash nativo (antes de que arranque Flutter). Mismo fondo oscuro que el
# tema de la app. Regenerar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0E"
  image: "branding_src/splash_logo.png"
  android_12:
    color: "#0A0A0E"
    image: "branding_src/splash_android12.png"
  android: true
  ios: true
  fullscreen: false
